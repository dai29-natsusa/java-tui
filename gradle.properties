# Keep Gradle's progress UI and log noise off the terminal while the TUI is running
org.gradle.console=plain
org.gradle.logging.level=quiet
org.gradle.daemon=true
quarkusPluginVersion=4.0.0.Beta1
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=4.0.0.Beta1
tambouiVersion=0.7.0-SNAPSHOT

# Default target platform for native builds (linux | windows)
nativePlatform=linux
