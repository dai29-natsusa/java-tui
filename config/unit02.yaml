---
unit:
  units:
    unit02:
      project: "vsmc"
      id: 2
      name: "xmcs2"
      ip: "192.168.40.11"
      hostname: "ol8xmcs2"
      # spotless:off
      heap: |
        # module, xms,  xms
        CACHE,    512, 2048
        CORE,     512, 1024
        CLIENT,   512, 2048
        AMHS,     128,  256
        HOST,     128,  256
        MONITOR,  512, 1024
        LAYOUT,   256,  256
      # spotless:on
      users:
        runner:
          username: "xmcs"
          password: "${RUNNER_PW}"
          user-id: -1
          group-id: -1
          workdir: "/home/xmcs/XMCS"
          localdir: "./"
          instances:
          - name: "xmcs_server"
            pid: 999
          - name: "xmcs-monitor"
            pid: 777
        admin:
          username: "root"
          password: "${ROOT_PW}"
      services:
      - id: 1
        name: "oracle"
        pid: 999
