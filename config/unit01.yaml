---
unit:
  units:
    unit01:
      project: "vsmc"
      id: 1
      name: "xmcs1"
      ip: "192.168.40.10"
      hostname: "ol8xmcs1"
      # spotless:off
      heap: |
        # module, xms,  xms
        CACHE,    512, 2048
        CORE,     512, 1024
        CLIENT,   512, 2048
        AMHS,     128,  256
        HOST,     128,  256
        MONITOR,  512, 1024
        LAYOUT,   256,  256
      # spotless:on
      users:
        runner:
          username: "xmcs"
          password: "${RUNNER_PW}"
          user-id: -1
          group-id: -1
          workdir: "/home/xmcs/XMCS"
          localdir: "./"
          instances:
          - name: "xmcs_server"
          - name: "amhs_emulator"
          - name: "xmcs-monitor"
        dbsys:
          username: "oracle"
          password: "${ORACLE_PW}"
          user-id: -1
          group-id: -1
          workdir: "/home/oracle/tmp"
          localdir: "oracle"
          instances:
          - name: "user"
          - name: "data"
          database:
            sid: xmcs
            connection-string: "sys/sys@${unit.units.unit01.ip}:1521/${unit.units.unit01.users.dbsys.database.sid} as sysdba"
            db-users:
              core:
                u: xmcs
                p: ${CORE_PW}
                script: "users/${unit.units.unit01.users.dbsys.database.db-users.core.u}.sql"
                dump: "data/${unit.units.unit01.users.dbsys.database.db-users.core.u}.dmp"
                fromuser: xmcs_vsmc
              emu:
                u: emu
                p: ${EMU_PW}
                script: "users/${unit.units.unit01.users.dbsys.database.db-users.emu.u}.sql"
                dump: "data/${unit.units.unit01.users.dbsys.database.db-users.emu.u}.dmp"
                fromuser: emu_vsmc
              hist:
                u: xmcshist
                p: ${HIST_PW}
                script: "users/${unit.units.unit01.users.dbsys.database.db-users.hist.u}.sql"
                dump: "data/${unit.units.unit01.users.dbsys.database.db-users.hist.u}.dmp"
                fromuser: hist_vsmc
        admin:
          username: "root"
          password: "${ROOT_PW}"
      services:
      - id: 1
        name: "oracle"
        pid: 999
