---
unit:
  project: "vsmc"
  id: 1
  name: "xmcs1"
  ip: "192.168.40.1"
  hostname: "ol8xmcs1"
  workdir: "/home/xmcs/XMCS"
  users:
  - username: "xmcs"
    password: "${RUNNER_PW}"
    user-id: -1
    group-id: -1
  - username: "oracle"
    password: "${ORACLE_PW}"
    user-id: -1
    group-id: -1
  - username: "root"
    password: "${ROOT_PW}"
  services:
  - id: 1
    name: "oracle"
    pid: 999
  instances:
  - name: "xmcs_server"
    pid: 999
    location: "${unit.workdir}/xmcs_server/scripts/core.sh"
  - name: "amps_emulator"
    pid: 888
    location: "${unit.workdir}/amhs_emulator/scripts/emu.sh"
  - name: "xmcs-monitor"
    pid: 777
    location: "${unit.workdir}/xmcs-monitor/scripts/monitor.sh"
