---
quarkus:
  application:
    name: "santa-soft-tui"
  banner:
    enabled: false
  config:
    locations: "./config/"
  log:
    console:
      enabled: false
    file:
      enabled: true
      path: "./logs/tui.log"
      level: "INFO"
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
    category:
      jp.co.santa.soft:
        level: "DEBUG"
  arc:
    remove-unused-beans: "fwk"
  native:
    container-runtime: podman
    auto-service-loader-registration: true
    builder-image: "quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-25"
    resources:
      includes:
      - "META-INF/services/**"
      - "tcss/**"
      - "**/*.tcss"
tamboui:
  backend: "panama"
  theme-path: "/tcss/default.tcss"
  mouse-capture: true
  tick-rate-ms: 50
